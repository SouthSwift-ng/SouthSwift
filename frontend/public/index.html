<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>SouthSwift — Nigeria's Most Secure Property Platform</title>
  <meta name="description" content="Verified agents, escrow payments, and auto-generated legal agreements for every Nigerian rental. SwiftShield protects your money until you confirm move-in." />
  <meta name="keywords" content="Nigeria property, rent Nigeria, verified agents, escrow rent, Lagos rental, Ilorin housing, student accommodation Nigeria, SouthSwift" />
  <meta name="author" content="SouthSwift Enterprise" />
  <meta name="theme-color" content="#1B4332" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Open Graph (WhatsApp, Facebook previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://southswift.com.ng" />
  <meta property="og:title" content="SouthSwift — Nigeria's Most Secure Property Platform" />
  <meta property="og:description" content="Verified agents. Escrow payments. Instant legal agreements. Your rent is protected until you confirm move-in." />
  <meta property="og:image" content="https://southswift.com.ng/og-image.png" />
  <meta property="og:site_name" content="SouthSwift" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SouthSwift — Nigeria's Most Secure Property Platform" />
  <meta name="twitter:description" content="Verified agents. Escrow payments. Instant legal agreements. Across Nigeria." />
  <meta name="twitter:image" content="https://southswift.com.ng/og-image.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #F8FAF8; }
    #root { min-height: 100vh; }

    /* ── RESPONSIVE UTILITIES ── */
    .ss-desktop { display: flex !important; }
    .ss-hamburger { display: none !important; }

    /* Leaflet fix */
    .leaflet-container { z-index: 1; }

    @media (max-width: 768px) {
      .ss-desktop { display: none !important; }
      .ss-hamburger { display: block !important; }

      /* Legal pages sidebar stacks on mobile */
      .ss-legal-body { flex-direction: column !important; }
      .ss-legal-sidebar { width: 100% !important; position: static !important; }

      /* ListingDetail body stacks */
      .ss-listing-body { flex-direction: column !important; }
      .ss-listing-right { position: static !important; }

      /* Home filter bar scrollable */
      .ss-filter-inner { overflow-x: auto !important; flex-wrap: nowrap !important; }
    }

    @media (max-width: 480px) {
      /* Hero title smaller on tiny screens */
      .ss-hero-title { font-size: 28px !important; }
      .ss-section-grid { grid-template-columns: 1fr !important; }
      /* Waitlist form single column on mobile */
      .ss-wl-form { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
